tr-bottom"><span>&copy; SPR&ouml;UT Leicester 2026</span> <span>Worker-owned co-operative in development</span></div></footer><script>(function(){
  function decodeRevEmails(){
    document.querySelectorAll('.js-rev-email').forEach(function(el){
      var raw=(el.getAttribute('title')||el.textContent).trim();
      var at=raw.indexOf('@');
      if(at===-1)return;
      var domain=raw.substring(0,at).split('').reverse().join('');
      var user=raw.substring(at+1).split('').reverse().join('');
      var email=user+'@'+domain;
      var a=document.createElement('a');
      a.href='mailto:'+email;
      var cls=el.className.replace('js-rev-email','').trim();
      if(cls)a.className=cls;
      a.textContent=el.getAttribute('title')?(el.textContent.trim()||email):email;
      el.parentNode.replaceChild(a,el);
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',decodeRevEmails);}
  else{decodeRevEmails();}
})();</script></body></html>
